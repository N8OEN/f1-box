<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>F1 Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#17181a;
    --concrete:#212328;
    --line:#33363c;
    --kerb:#e8e4dc;
    --muted:#8b9096;
    --green:#14b45a;
    --yellow:#f4c020;
    --red:#d1252b;
    --orange:#ff5f1f;
    --violet:#8b5cf6;
    --white:#ffffff;
    --display:"Barlow Condensed","Oswald","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--asphalt);color:var(--kerb)}
  body{
    font-family:var(--display);
    padding:14px 14px calc(20px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }

  /* ── utility row ─────────────────────────────── */
  .bar{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    color:var(--muted);text-transform:uppercase;margin-bottom:12px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
  .dot.live{background:var(--green);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  .bar .sess{margin-left:auto;color:var(--kerb);text-transform:none;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}

  /* ── the strip mirror: the hero ──────────────── */
  .strip{
    display:grid;grid-template-columns:repeat(15,1fr);gap:4px;
    padding:16px 12px;background:#0e0f11;
    border:1px solid var(--line);border-radius:4px;
  }
  .px{
    aspect-ratio:1/2.4;border-radius:2px;background:#1a1b1e;
    transition:background 60ms linear, box-shadow 60ms linear;
  }

  /* ── flag readout ────────────────────────────── */
  .readout{padding:18px 2px 20px;border-bottom:1px solid var(--line)}
  .flagname{
    font-size:clamp(40px,13vw,64px);font-weight:700;line-height:.9;
    letter-spacing:-.01em;text-transform:uppercase;margin:0;
    transition:color 120ms linear;
  }
  .meta{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;margin-top:10px;
  }
  .meta b{color:var(--kerb);font-weight:500}

  /* ── controls ────────────────────────────────── */
  h2{
    font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);
    letter-spacing:.1em;text-transform:uppercase;
    margin:22px 0 10px;
  }
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  button{
    font-family:var(--display);font-size:19px;font-weight:600;
    text-transform:uppercase;letter-spacing:.02em;
    color:var(--kerb);background:var(--concrete);
    border:1px solid var(--line);border-radius:3px;
    padding:15px 12px;text-align:left;cursor:pointer;
    display:flex;align-items:center;gap:10px;
    transition:background 100ms;
  }
  button:active{background:#2c2f35}
  button:focus-visible{outline:2px solid var(--kerb);outline-offset:2px}
  .swatch{width:4px;align-self:stretch;border-radius:2px;flex:none}
  .wide{grid-column:1/-1;justify-content:center;text-align:center}

  .replay{display:grid;grid-template-columns:1fr auto auto;gap:8px}
  input{
    font-family:var(--mono);font-size:15px;color:var(--kerb);
    background:var(--concrete);border:1px solid var(--line);
    border-radius:3px;padding:13px 12px;min-width:0;
  }
  input:focus{outline:none;border-color:var(--muted)}
  .replay button{justify-content:center;padding:13px 16px;font-size:16px}

  /* ── log ─────────────────────────────────────── */
  #log{
    font-family:var(--mono);font-size:12px;line-height:1.55;
    margin-top:10px;max-height:44vh;overflow-y:auto;
    border-top:1px solid var(--line);padding-top:10px;
  }
  .row{display:flex;gap:9px;padding:3px 0}
  .row time{color:#5f646b;flex:none}
  .row span{color:var(--muted);word-break:break-word}
  .row.ok span{color:var(--green)}
  .row.error span{color:var(--red)}
  .row.GREEN span{color:var(--green)}
  .row.YELLOW span,.row.DOUBLE_YELLOW span{color:var(--yellow)}
  .row.RED span{color:var(--red)}
  .row.SC span{color:var(--orange)}
  .row.VSC span{color:var(--violet)}
  .row.CHEQUERED span{color:var(--white)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span id="conn">Connecting</span>
  <span class="sess" id="sess">—</span>
</div>

<div class="strip" id="strip"></div>

<div class="readout">
  <h1 class="flagname" id="flagname">Track dark</h1>
  <div class="meta">Source <b id="source">idle</b> · <span id="hold">Following the feed</span></div>
</div>

<h2>Set a flag by hand</h2>
<div class="grid" id="buttons"></div>

<h2>Replay a past session</h2>
<div class="replay">
  <input id="skey" inputmode="numeric" placeholder="OpenF1 session key">
  <input id="speed" inputmode="decimal" value="20" style="width:64px" aria-label="Replay speed">
  <button id="go">Play</button>
</div>

<h2>Race control</h2>
<div id="log"></div>

<script>
const FLAGS = [
  ["GREEN","Green","--green"],
  ["YELLOW","Yellow","--yellow"],
  ["DOUBLE_YELLOW","Double yellow","--yellow"],
  ["RED","Red","--red"],
  ["SC","Safety car","--orange"],
  ["VSC","Virtual SC","--violet"],
  ["CHEQUERED","Chequered","--white"],
  ["OFF","All out","--line"],
];
const COLOUR = {
  GREEN:"--green", YELLOW:"--yellow", DOUBLE_YELLOW:"--yellow", RED:"--red",
  SC:"--orange", VSC:"--violet", CHEQUERED:"--white", OFF:"--muted"
};

const strip = document.getElementById("strip");
const px = [];
for (let i = 0; i < 15; i++) {
  const d = document.createElement("div");
  d.className = "px";
  strip.appendChild(d);
  px.push(d);
}

const btns = document.getElementById("buttons");
for (const [flag, label, varname] of FLAGS) {
  const b = document.createElement("button");
  b.innerHTML = `<i class="swatch" style="background:var(${varname})"></i>${label}`;
  b.onclick = () => post("/api/flag", {flag});
  btns.appendChild(b);
}
const auto = document.createElement("button");
auto.className = "wide";
auto.textContent = "Hand back to the feed";
auto.onclick = () => post("/api/flag", {flag:"AUTO"});
btns.appendChild(auto);

document.getElementById("go").onclick = () => post("/api/replay", {
  session_key: document.getElementById("skey").value.trim(),
  speed: parseFloat(document.getElementById("speed").value) || 10
});

function post(url, body) {
  fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
              body: JSON.stringify(body)});
}

function addRow(e, atTop) {
  const d = document.createElement("div");
  d.className = "row " + (e.kind || "info");
  d.innerHTML = `<time>${e.t}</time><span></span>`;
  d.querySelector("span").textContent = e.text;
  const log = document.getElementById("log");
  if (atTop && log.firstChild) log.insertBefore(d, log.firstChild);
  else log.appendChild(d);
  while (log.childElementCount > 200) log.removeChild(log.lastChild);
}

let ws;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
                     + location.host + "/ws");
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "frame") {
      for (let i = 0; i < px.length && i < m.px.length; i++) {
        const [r,g,b] = m.px[i];
        px[i].style.background = `rgb(${r},${g},${b})`;
        px[i].style.boxShadow = (r+g+b) > 40
          ? `0 0 14px rgba(${r},${g},${b},.55)` : "none";
      }
    } else if (m.type === "state") {
      const name = document.getElementById("flagname");
      name.textContent = m.label;
      name.style.color = `var(${COLOUR[m.flag] || "--kerb"})`;
      document.getElementById("source").textContent = m.source;
      document.getElementById("sess").textContent = m.session;
      document.getElementById("hold").textContent =
        m.manual ? "Manual hold, 30s" : "Following the feed";
      document.getElementById("dot").className = "dot" + (m.connected ? " live" : "");
      document.getElementById("conn").textContent =
        m.connected ? "Live timing" : "No live feed";
    } else if (m.type === "log") {
      addRow(m.entry, true);
    } else if (m.type === "backlog") {
      m.entries.slice().reverse().forEach(e => addRow(e, false));
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
